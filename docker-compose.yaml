version: '3.8'

x-airflow-common: &airflow-common
  build: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: bionicpro-airflow
    AIRFLOW_CONN_CRM: postgresql://airflow:airflow@postgres/crm
    AIRFLOW_CONN_TELEMETRY: postgresql://airflow:airflow@postgres/telemetry
    AIRFLOW_CONN_CLICKHOUSE: clickhouse://default:clickhouse@clickhouse:8123/reports
  volumes:
    - ./airflow/dags:/opt/airflow/dags
  depends_on:
    postgres:
      condition: service_healthy

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  keycloak:
    build: ./keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap
  openldap:
    image: osixia/openldap:1.5.0
    command: --copy-service
    environment:
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
  redis:
    image: redis:7-alpine
  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      KC_ISSUER_INTERNAL: http://keycloak:8080/realms/reports-realm
      KC_ISSUER_PUBLIC: http://localhost:8080/realms/reports-realm
      KC_CLIENT_ID: reports-frontend
      KC_CLIENT_SECRET: b4d78a98a5cc476352f20e9f4ff223724f7f0a532a786df1
      REDIRECT_URL: http://localhost:3000/auth/callback
      APP_URL: http://localhost:3000/
      REDIS_ADDR: redis:6379
      SESSION_TTL: 30m
      SESSION_ENC_KEY: JTB1mWVJy5si7stZbtfumlhr/5Vi2xT5jAmBL0fts90=
    depends_on:
      - keycloak
      - redis
  reports-api:
    build: ./reports-api
    environment:
      KC_JWKS_URL: http://keycloak:8080/realms/reports-realm/protocol/openid-connect/certs
      KC_ISSUER: http://localhost:8080/realms/reports-realm
      CH_HOST: clickhouse
      CH_PASSWORD: clickhouse
    depends_on:
      - keycloak
      - clickhouse
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth
      - reports-api
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - ./sources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_PASSWORD: clickhouse
  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com"
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_started
