server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /auth/ {
        proxy_pass http://bionicpro-auth:8000;
        proxy_set_header Host $host;
    }
    
    location = /auth/verify {
        internal;
        proxy_pass http://bionicpro-auth:8000;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    
    location = /reports {
        auth_request /auth/verify;
        auth_request_set $access_token $upstream_http_x_access_token;
        auth_request_set $session_cookie $upstream_http_set_cookie;
        proxy_set_header Authorization "Bearer $access_token";
        proxy_pass http://reports-api:8000;
        add_header Set-Cookie $session_cookie;
    }

    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
